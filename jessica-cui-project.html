    <style>
        :root { --paper: #f7f3f0; --ink: #111; }
        body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
        .project-art { background: linear-gradient(145deg, #dedbd5, #aaa6a0 52%, #d2cec8); }
        .project-art::after { content: ''; display: block; width: 42%; height: 42%; margin: 29% auto; border: 1px solid rgba(0,0,0,.13); transform: rotate(45deg); }
        .social-links { display: flex; align-items: center; gap: 12px; }
        .social-link { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; color: #000; opacity: .8; transition: opacity .2s ease, transform .2s ease; }
        .social-link:hover, .social-link:focus-visible { opacity: .45; transform: translateY(-1px); }
        .social-link:focus-visible { outline: 1px solid #000; outline-offset: 4px; }
        .social-link svg { width: 19px; height: 19px; display: block; }
        .social-monogram { font-size: 10px; font-weight: 900; letter-spacing: -.08em; }
        .project-viewer-main{flex:1;min-height:0;padding:18px clamp(16px,4vw,64px) 28px;display:flex;flex-direction:column}
        .project-viewer{width:min(1500px,100%);margin:auto;display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;gap:18px}
        .project-image-stage{height:clamp(340px,68svh,800px);min-height:0;overflow:hidden;display:grid;place-items:center;background:#202020}
        .project-image-stage img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
        .project-arrow{width:56px;height:72px;border:1px solid rgba(0,0,0,.18);background:#f7f3f0;color:#111;font-size:30px;cursor:pointer}
        .project-arrow:hover:not(:disabled),.project-arrow:focus-visible{background:#111;color:#fff}
        .project-arrow:disabled{opacity:.2;cursor:default}
        .project-caption{width:min(1500px,100%);margin:16px auto 0;display:grid;grid-template-columns:1fr auto;gap:7px 24px;align-items:end}
        .project-category{grid-column:1/-1;font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:#777}
        .project-caption h1{grid-column:1;margin:0;font-size:clamp(30px,5vw,64px);line-height:.95;letter-spacing:-.055em}
        .project-caption p{grid-column:1;margin:0;max-width:680px;font-size:13px;line-height:1.55;color:#666}
        .project-count{grid-column:2;grid-row:2/4;font-size:10px;font-weight:900;letter-spacing:.2em}
        @media(max-width:720px){.project-viewer-main{padding:14px 16px 22px}.project-viewer{grid-template-columns:1fr 1fr;gap:9px}.project-image-stage{grid-column:1/-1;grid-row:1;height:clamp(340px,58svh,620px)}.project-arrow{width:100%;height:52px;font-size:25px}.project-caption{grid-template-columns:1fr;margin-top:14px}.project-caption h1{font-size:clamp(28px,9vw,48px)}.project-count{grid-column:1;grid-row:auto;margin-top:8px}}
        .cms-project-figure { margin:0; background:#e8e5e1; }
        .cms-project-figure img { display:block; width:100%; height:auto; max-height:85vh; object-fit:contain; }
        .cms-project-status { margin-top:48px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    
        
        
        
        
        /* artwork-viewer-upgrade */
        .ratio-stage, .viewer-stage, .illustration-stage, .project-image-stage, .ratio-project-stage {
          position: relative; display: grid; place-items: center; height: clamp(300px, 76svh, 900px); min-height: 0; overflow: hidden; background: var(--paper);
        }
        .ratio-stage .slide, .ratio-art { display: grid; place-items: center; background: var(--paper); }
        .ratio-stage img, .viewer-stage img, .illustration-stage img, .project-image-stage img, .ratio-project-stage img {
          position: relative; inset: auto; display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%;
          object-fit: contain; object-position: center; background: var(--paper); transform: none; visibility: visible; cursor: zoom-in;
        }
        .ratio-stage img[data-fit-state="loading"], .viewer-stage img[data-fit-state="loading"], .illustration-stage img[data-fit-state="loading"], .project-image-stage img[data-fit-state="loading"], .ratio-project-stage img[data-fit-state="loading"] { visibility: hidden; }
        .ratio-arrow, .viewer-arrow, .project-arrow { background: var(--paper); }
        .ratio-arrow[hidden], .viewer-arrow[hidden], .project-arrow[hidden] { display: none !important; }
        #viewer-image:focus-visible, #slide-image:focus-visible, #illustration-image:focus-visible, #project-image:focus-visible {
          outline: 2px solid currentColor; outline-offset: 3px;
        }
        .artwork-zoom[open] {
          position: fixed; inset: 3vh 2vw; width: auto; height: auto; max-width: none; max-height: none; margin: 0;
          padding: 14px; border: 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden;
          background: var(--paper); color: var(--ink, #111);
        }
        .artwork-zoom::backdrop { background: rgba(0,0,0,.76); }
        .zoom-toolbar { min-height: 42px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .zoom-label { font-size: 10px; font-weight: 900; letter-spacing: .2em; text-transform: uppercase; }
        .zoom-close { min-width: 64px; min-height: 38px; padding: 7px 14px; border: 1px solid currentColor; background: var(--paper); color: inherit; cursor: pointer; }
        .zoom-close:hover, .zoom-close:focus-visible { background: var(--ink, #111); color: var(--paper); }
        .zoom-viewport { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; overscroll-behavior: contain; background: var(--paper); }
        .zoom-image { position: absolute; left: 50%; top: 50%; display: block; max-width: none; max-height: none; object-fit: contain; object-position: center; transform: translate(-50%, -50%); user-select: none; }
        @media (max-width: 720px) {
          .ratio-stage, .viewer-stage, .illustration-stage, .project-image-stage, .ratio-project-stage { height: clamp(280px, 58svh, 620px); }
          .artwork-zoom[open] { inset: 1vh 1vw; padding: 8px; }
          .zoom-toolbar { align-items: center; flex-direction: row; gap: 7px; }
        }

<style id="project-gallery-layout">
/* project-gallery-layout: larger-equal-height-continuous-strip-20260929 */
.project-viewer-main{flex:1;min-height:0;width:100%;padding:8px clamp(16px,2.2vw,36px) 22px;display:flex;flex-direction:column;background:var(--paper)}
.character-slider{min-width:0}
.project-gallery{position:relative;width:min(1600px,100%);margin:0 auto}

.project-gallery-slide[hidden]{display:none!important}

.project-gallery-slide[data-active="true"] img{cursor:zoom-in}

.project-gallery .project-arrow:last-child{left:auto;right:8px}

.project-gallery .project-arrow:focus-visible{outline:2px solid #111;outline-offset:3px;opacity:1}
.project-gallery .project-arrow[hidden]{display:none!important}
.project-caption{width:min(1600px,100%);margin:14px auto 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 24px;align-items:end}
.project-category{grid-column:1/-1;font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:#777}

<script>/* artwork-zoom-enhancement */
(() => {
  const selectors = '#viewer-image, #slide-image, #illustration-image, #project-image';
  const images = [...document.querySelectorAll(selectors)];
  if ((!images.length && !document.querySelector('[data-artwork-strip]')) || document.querySelector('.artwork-zoom')) return;

  const stageSelector = '.ratio-stage, .viewer-stage, .illustration-stage, .project-image-stage, .ratio-project-stage';
  let activeImage = null;
  let fitGeneration = 0;

  const dialog = document.createElement('dialog');
  dialog.className = 'artwork-zoom';
  dialog.setAttribute('aria-label', 'Artwork detail viewer');
  dialog.innerHTML = `
    <div class="zoom-toolbar">
      <span class="zoom-label">Artwork detail</span>
      <button class="zoom-close" type="button" data-zoom-close>Close</button>
    </div>
    <div class="zoom-viewport" aria-label="Artwork image">
      <img class="zoom-image" alt="" draggable="false">
    </div>`;
  document.body.append(dialog);

  const viewport = dialog.querySelector('.zoom-viewport');
  const zoomImage = dialog.querySelector('.zoom-image');
  const closeButton = dialog.querySelector('[data-zoom-close]');

  function fitToStage(image) {
    const stage = image.closest(stageSelector);
    if (!stage || !image.complete || !image.naturalWidth || !image.naturalHeight) return false;
    const width = stage.clientWidth, height = stage.clientHeight;
    if (!width || !height) return false;
    const scale = Math.min(width / image.naturalWidth, height / image.naturalHeight);
    image.style.width = `${image.naturalWidth * scale}px`;
    image.style.height = `${image.naturalHeight * scale}px`;
    image.style.maxWidth = 'none';
    image.style.maxHeight = 'none';
    image.style.transform = 'none';
    image.style.visibility = 'visible';
    image.dataset.fitState = 'fit';
    if (dialog.open && activeImage === image) fitDetailImage();
    return true;
  }

  function scheduleFit(image, generation = ++fitGeneration) {
    if (!image.complete || !image.naturalWidth) return;
    const decoded = typeof image.decode === 'function' ? image.decode().catch(() => {}) : Promise.resolve();
    decoded.then(() => requestAnimationFrame(() => requestAnimationFrame(() => {
      if (generation === fitGeneration && image.isConnected) fitToStage(image);
    })));
  }

  function resetArtworkFit(image = activeImage) {
    if (!image) return;
    activeImage = image;
    image.style.transform = 'none';
    image.style.width = '100%';
    image.style.height = '100%';
    image.style.maxWidth = '100%';
    image.style.maxHeight = '100%';
    const ready = image.complete && image.naturalWidth > 0;
    image.style.visibility = ready ? 'visible' : 'hidden';
    image.dataset.fitState = ready ? 'fit' : 'loading';
    if (dialog.open) {
      zoomImage.style.width = '';
      zoomImage.style.height = '';
      zoomImage.style.transform = 'translate(-50%, -50%)';
      zoomImage.src = image.currentSrc || image.src;
    }
    if (!fitToStage(image)) scheduleFit(image);
  }

  function fitDetailImage() {
    if (!activeImage?.naturalWidth || !zoomImage.naturalWidth) return;
    const width = viewport.clientWidth, height = viewport.clientHeight;
    if (!width || !height) return;
    const scale = Math.min(width / zoomImage.naturalWidth, height / zoomImage.naturalHeight);
    zoomImage.style.width = `${zoomImage.naturalWidth * scale}px`;
    zoomImage.style.height = `${zoomImage.naturalHeight * scale}px`;
    zoomImage.style.transform = 'translate(-50%, -50%)';
  }

  function openArtworkDetail(image) {
    if (!image.complete || !image.naturalWidth) return;
    activeImage = image;
    zoomImage.alt = image.alt || 'Artwork';
    zoomImage.style.width = '';
    zoomImage.style.height = '';
    zoomImage.style.transform = 'translate(-50%, -50%)';
    zoomImage.src = image.currentSrc || image.src;
    if (!dialog.open) dialog.showModal();
    requestAnimationFrame(() => requestAnimationFrame(fitDetailImage));
  }

  window.openArtworkDetail = openArtworkDetail;
  window.resetArtworkFit = resetArtworkFit;
  zoomImage.addEventListener('load', () => requestAnimationFrame(() => requestAnimationFrame(fitDetailImage)));
  images.forEach((image) => {
    activeImage ||= image;
    image.tabIndex = 0;
    image.setAttribute('role', 'button');
    image.setAttribute('aria-label', `${image.alt || 'Artwork'}. Open artwork detail`);
    image.addEventListener('click', () => openArtworkDetail(image));
    image.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openArtworkDetail(image); }
    });
    image.addEventListener('load', () => {
      const generation = ++fitGeneration;
      scheduleFit(image, generation);
      if (dialog.open && activeImage === image) {
        zoomImage.alt = image.alt || 'Artwork';
        zoomImage.src = image.currentSrc || image.src;
        requestAnimationFrame(() => requestAnimationFrame(fitDetailImage));
      }
    });
    new MutationObserver(() => resetArtworkFit(image)).observe(image, { attributes: true, attributeFilter: ['src', 'srcset'] });
    if (image.complete && image.naturalWidth) scheduleFit(image);
    else {
      image.style.width = '100%';
      image.style.height = '100%';
      image.style.visibility = 'hidden';
      image.dataset.fitState = 'loading';
    }
  });

  closeButton.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
  dialog.addEventListener('close', () => activeImage?.focus({ preventScroll: true }));
  document.addEventListener('keydown', (event) => {
    if (!dialog.open || !['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    event.stopPropagation();
  }, true);
  window.addEventListener('resize', () => {
    if (activeImage?.dataset.fitState === 'fit') scheduleFit(activeImage);
    if (dialog.open) fitDetailImage();
  });
})();
